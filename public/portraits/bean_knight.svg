<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#1e3a5f" stop-opacity="0.8"/>
      <stop offset="60%" stop-color="#0a101d" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#04060a" stop-opacity="1"/>
    </radialGradient>
    <radialGradient id="glowGold" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffd166" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ffd166" stop-opacity="0"/>
    </radialGradient>
    <!-- Metal Armor Gradients -->
    <linearGradient id="silverFoil" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#cbd5e1"/>
      <stop offset="70%" stop-color="#64748b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="needleBlade" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
    <!-- Bean Body Gradient -->
    <linearGradient id="beanBody" x1="20%" y1="10%" x2="80%" y2="90%">
      <stop offset="0%" stop-color="#2d3748"/>
      <stop offset="35%" stop-color="#1a202c"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <!-- Cap Shield Gradient -->
    <radialGradient id="bottleCap" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="70%" stop-color="#991b1b"/>
      <stop offset="100%" stop-color="#450a0a"/>
    </radialGradient>
    <!-- Filter Glow -->
    <filter id="auraGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="400" height="400" fill="url(#bgGrad)"/>
  <circle cx="200" cy="200" r="160" fill="url(#glowGold)"/>

  <!-- Magic Rune Circle -->
  <circle cx="200" cy="200" r="170" fill="none" stroke="#c99738" stroke-width="1.5" stroke-dasharray="8 6" opacity="0.4"/>
  <circle cx="200" cy="200" r="185" fill="none" stroke="#38bdf8" stroke-width="1" opacity="0.2"/>

  <!-- Aura Behind Character -->
  <circle cx="200" cy="210" r="85" fill="#f59e0b" opacity="0.2" filter="url(#auraGlow)"/>

  <!-- Shadows -->
  <ellipse cx="200" cy="330" rx="75" ry="16" fill="#000000" opacity="0.6"/>

  <!-- Character: Tiny Bean Body -->
  <!-- Legs / Tiny Armored Greaves -->
  <path d="M175,280 L165,325 L185,325 L188,280 Z" fill="url(#silverFoil)"/>
  <path d="M225,280 L212,325 L232,325 L235,280 Z" fill="url(#silverFoil)"/>
  <!-- Sabatons (Feet) -->
  <path d="M155,325 Q165,315 185,325 L180,332 L150,332 Z" fill="#475569"/>
  <path d="M210,325 Q225,315 245,325 L240,332 L205,332 Z" fill="#475569"/>

  <!-- Red Hero Cape Behind -->
  <path d="M160,195 Q130,250 120,310 Q160,300 200,315 Q240,300 280,310 Q270,250 240,195 Z" fill="#b91c1c" opacity="0.9"/>
  <path d="M130,260 Q120,310 110,325 Q140,315 160,310 Z" fill="#7f1d1d"/>

  <!-- Black Bean Body (Oval Kidney Shape) -->
  <path d="M160,150 C130,170 125,240 160,285 C190,305 230,295 245,265 C265,225 260,175 235,150 C210,130 180,135 160,150 Z" fill="url(#beanBody)"/>
  <!-- Bean Glossy Highlight -->
  <path d="M160,165 C145,185 145,230 165,260 C160,230 160,185 175,170 Z" fill="#ffffff" opacity="0.18"/>

  <!-- Knight Armor: Breastplate (Crinkled Foil Armor) -->
  <path d="M165,200 L235,200 L228,265 L200,280 L172,265 Z" fill="url(#silverFoil)" stroke="#1e293b" stroke-width="1.5"/>
  <!-- Breastplate Center Ridge -->
  <line x1="200" y1="200" x2="200" y2="280" stroke="#f8fafc" stroke-width="1.5" opacity="0.6"/>
  <!-- Gold Rivets on Armor -->
  <circle cx="175" cy="210" r="3" fill="#fbbf24"/>
  <circle cx="225" cy="210" r="3" fill="#fbbf24"/>
  <circle cx="200" cy="265" r="3" fill="#fbbf24"/>

  <!-- Knight Helmet (Great Helm with Visor) -->
  <path d="M160,140 Q150,90 200,85 Q250,90 240,140 Q250,180 200,185 Q150,180 160,140 Z" fill="url(#silverFoil)" stroke="#0f172a" stroke-width="2"/>
  <!-- Helmet Visor Slit (T-shape) -->
  <path d="M175,135 L225,135 L225,142 L205,142 L205,165 L195,165 L195,142 L175,142 Z" fill="#090d16"/>
  <!-- Determined Glowing Eyes Behind Visor -->
  <circle cx="188" cy="138" r="3" fill="#38bdf8" filter="url(#auraGlow)"/>
  <circle cx="212" cy="138" r="3" fill="#38bdf8" filter="url(#auraGlow)"/>

  <!-- Helmet Plume / Feather Crest (Crimson) -->
  <path d="M196,85 Q190,40 160,35 Q185,55 198,75 Z" fill="#ef4444"/>
  <path d="M200,85 Q205,30 220,25 Q210,55 202,78 Z" fill="#dc2626"/>

  <!-- Left Arm: Bottle Cap Shield -->
  <g transform="translate(135, 195) rotate(-10)">
    <circle cx="0" cy="0" r="46" fill="url(#bottleCap)" stroke="#f8fafc" stroke-width="2.5"/>
    <circle cx="0" cy="0" r="38" fill="none" stroke="#fca5a5" stroke-width="1.5" stroke-dasharray="5 3"/>
    <!-- Bottle Cap Ridges (Fluted Edge) -->
    <path d="M-44,-10 L-48,-5 L-44,0 L-48,5 L-44,10 L-48,15 L-44,20" stroke="#b91c1c" stroke-width="2" fill="none"/>
    <!-- Shield Emblem: Golden Lion Head / Fleur -->
    <path d="M0,-20 L8,-5 L20,-5 L10,5 L14,20 L0,10 L-14,20 L-10,5 L-20,-5 L-8,-5 Z" fill="#ffd166" stroke="#b45309" stroke-width="1"/>
    <!-- Shield Highlight -->
    <path d="M-30,-25 Q0,-40 30,-25 Q0,-30 -30,-25 Z" fill="#ffffff" opacity="0.3"/>
  </g>

  <!-- Right Arm: Wielding Needle Rapier -->
  <!-- Arm & Gauntlet -->
  <path d="M235,210 L275,200 L285,215 L245,230 Z" fill="url(#silverFoil)"/>
  <!-- Sewing Needle Rapier (Long, Shiny, with Eyelet Hilt) -->
  <g transform="translate(280, 205) rotate(-35)">
    <!-- Needle Blade -->
    <polygon points="0,-8 6,-8 3,-175 0,-175" fill="url(#needleBlade)" stroke="#ffffff" stroke-width="0.5"/>
    <!-- Sharp Needle Point -->
    <polygon points="0,-175 3,-188 6,-175" fill="#ffffff" filter="url(#auraGlow)"/>
    <!-- Needle Eyelet (The hole at the top made into guard) -->
    <ellipse cx="3" cy="-15" rx="7" ry="12" fill="url(#silverFoil)" stroke="#334155" stroke-width="1.5"/>
    <ellipse cx="3" cy="-15" rx="3" ry="7" fill="#090d16"/>
    <!-- Golden Thread trailing from eyelet -->
    <path d="M3,-15 Q30,-10 40,25 Q45,60 25,90" fill="none" stroke="#fbbf24" stroke-width="2" filter="url(#auraGlow)"/>
    <!-- Hilt Grip -->
    <rect x="0" y="-3" width="6" height="24" rx="2" fill="#78350f"/>
    <!-- Pommel Bead -->
    <circle cx="3" cy="24" r="5" fill="#ffd166" stroke="#b45309" stroke-width="1"/>
  </g>

  <!-- Title Ribbon Banner at Bottom -->
  <g transform="translate(200, 370)">
    <rect x="-140" y="-18" width="280" height="30" rx="6" fill="#0f172a" stroke="#c99738" stroke-width="1.5"/>
    <text x="0" y="3" font-family="'Sarabun', sans-serif" font-weight="bold" font-size="13" fill="#ffd166" text-anchor="middle" letter-spacing="0.5">
      ⚔️ อัศวินเมล็ดถั่วดำ (Tiny Bean Knight)
    </text>
  </g>
</svg>
