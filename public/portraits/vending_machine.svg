<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%" shape-rendering="crispEdges">
  <defs>
    <radialGradient id="dungeonGlow" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#1e1b4b" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#0f172a" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#030712" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="machineMetal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="30%" stop-color="#1e293b"/>
      <stop offset="70%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="goldFiligree" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="glassWindow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.25"/>
      <stop offset="40%" stop-color="#0369a1" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#075985" stop-opacity="0.6"/>
    </linearGradient>
    <filter id="neonPulse" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background: Dark Cobblestone Dungeon -->
  <rect width="400" height="400" fill="url(#dungeonGlow)"/>

  <!-- Dungeon Cobblestones Floor -->
  <rect x="0" y="340" width="400" height="60" fill="#0b0f19"/>
  <rect x="20" y="350" width="80" height="15" fill="#1e293b"/>
  <rect x="120" y="350" width="100" height="15" fill="#1e293b"/>
  <rect x="240" y="350" width="70" height="15" fill="#1e293b"/>
  <rect x="330" y="350" width="60" height="15" fill="#1e293b"/>
  <rect x="50" y="375" width="90" height="15" fill="#151d2f"/>
  <rect x="160" y="375" width="110" height="15" fill="#151d2f"/>
  <rect x="290" y="375" width="80" height="15" fill="#151d2f"/>

  <!-- Ambient Light from Dispense Tray and Sign -->
  <circle cx="200" cy="220" r="140" fill="#0284c7" opacity="0.12"/>
  <circle cx="200" cy="320" r="90" fill="#ffd166" opacity="0.15"/>

  <!-- Vending Machine Shadow -->
  <ellipse cx="200" cy="355" rx="100" ry="16" fill="#000000" opacity="0.75"/>

  <!-- Vending Machine Outer Chassis (Heavy Armored Steel) -->
  <rect x="105" y="45" width="190" height="305" rx="8" fill="url(#machineMetal)" stroke="#475569" stroke-width="3"/>
  <!-- Gold Rivets / Corner Brackets -->
  <rect x="105" y="45" width="18" height="18" fill="url(#goldFiligree)"/>
  <rect x="277" y="45" width="18" height="18" fill="url(#goldFiligree)"/>
  <rect x="105" y="332" width="18" height="18" fill="url(#goldFiligree)"/>
  <rect x="277" y="332" width="18" height="18" fill="url(#goldFiligree)"/>

  <!-- Top Header Marquee: Enchanted Runic Signboard -->
  <rect x="120" y="60" width="160" height="38" rx="4" fill="#0f172a" stroke="url(#goldFiligree)" stroke-width="2"/>
  <text x="200" y="80" fill="#38bdf8" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle" filter="url(#neonPulse)">
    ✦ 魔導自動販売機 ✦
  </text>
  <text x="200" y="93" fill="#facc15" font-family="'Cinzel', serif" font-size="9" font-weight="bold" text-anchor="middle">
    POTION &amp; ELIXIR DISPENSER
  </text>

  <!-- Main Glass Display Showcase Window -->
  <rect x="120" y="108" width="115" height="150" rx="4" fill="url(#glassWindow)" stroke="#38bdf8" stroke-width="2"/>

  <!-- Shelf 1: Crimson Health Potions -->
  <line x1="120" y1="155" x2="235" y2="155" stroke="#334155" stroke-width="3"/>
  <!-- Potion 1 (Red HP) -->
  <rect x="132" y="125" width="16" height="24" rx="3" fill="#ef4444" stroke="#ffffff" stroke-width="1"/>
  <rect x="136" y="118" width="8" height="7" fill="#b45309"/>
  <rect x="135" y="132" width="10" height="10" fill="#fca5a5" opacity="0.6"/>
  <!-- Potion 2 (Red HP) -->
  <rect x="156" y="125" width="16" height="24" rx="3" fill="#dc2626" stroke="#ffffff" stroke-width="1"/>
  <rect x="160" y="118" width="8" height="7" fill="#b45309"/>
  <!-- Potion 3 (Red HP) -->
  <rect x="180" y="125" width="16" height="24" rx="3" fill="#ef4444" stroke="#ffffff" stroke-width="1"/>
  <rect x="184" y="118" width="8" height="7" fill="#b45309"/>
  <!-- Potion 4 (Red HP) -->
  <rect x="204" y="125" width="16" height="24" rx="3" fill="#dc2626" stroke="#ffffff" stroke-width="1"/>
  <rect x="208" y="118" width="8" height="7" fill="#b45309"/>

  <!-- Shelf 2: Cyan Mana Flasks -->
  <line x1="120" y1="205" x2="235" y2="205" stroke="#334155" stroke-width="3"/>
  <!-- Mana Flask 1 -->
  <rect x="132" y="175" width="16" height="24" rx="3" fill="#0284c7" stroke="#ffffff" stroke-width="1"/>
  <rect x="136" y="168" width="8" height="7" fill="#94a3b8"/>
  <!-- Mana Flask 2 -->
  <rect x="156" y="175" width="16" height="24" rx="3" fill="#38bdf8" stroke="#ffffff" stroke-width="1"/>
  <rect x="160" y="168" width="8" height="7" fill="#94a3b8"/>
  <!-- Mana Flask 3 -->
  <rect x="180" y="175" width="16" height="24" rx="3" fill="#0284c7" stroke="#ffffff" stroke-width="1"/>
  <rect x="184" y="168" width="8" height="7" fill="#94a3b8"/>
  <!-- Mana Flask 4 -->
  <rect x="204" y="175" width="16" height="24" rx="3" fill="#38bdf8" stroke="#ffffff" stroke-width="1"/>
  <rect x="208" y="168" width="8" height="7" fill="#94a3b8"/>

  <!-- Shelf 3: Golden Elixirs & Stamina Tonics -->
  <!-- Tonic 1 -->
  <rect x="136" y="225" width="16" height="25" rx="3" fill="#eab308" stroke="#ffffff" stroke-width="1"/>
  <rect x="140" y="218" width="8" height="7" fill="#78350f"/>
  <!-- Tonic 2 -->
  <rect x="168" y="225" width="16" height="25" rx="3" fill="#a855f7" stroke="#ffffff" stroke-width="1"/>
  <rect x="172" y="218" width="8" height="7" fill="#78350f"/>
  <!-- Tonic 3 -->
  <rect x="200" y="225" width="16" height="25" rx="3" fill="#22c55e" stroke="#ffffff" stroke-width="1"/>
  <rect x="204" y="218" width="8" height="7" fill="#78350f"/>

  <!-- Glass Diagonal Reflection Glare -->
  <polygon points="122,110 160,110 130,256 122,256" fill="#ffffff" opacity="0.12"/>

  <!-- Control & Payment Panel (Right Side) -->
  <rect x="245" y="108" width="38" height="150" rx="3" fill="#0b0f19" stroke="#334155" stroke-width="1.5"/>

  <!-- LED / Runic Coin Balance Display -->
  <rect x="249" y="115" width="30" height="16" fill="#052e16" stroke="#22c55e" stroke-width="1"/>
  <text x="264" y="127" fill="#4ade80" font-family="monospace" font-size="9" font-weight="bold" text-anchor="middle">
    999G
  </text>

  <!-- Coin Slot (Glowing with warm golden light) -->
  <rect x="254" y="140" width="20" height="14" rx="2" fill="#1e293b" stroke="#ffd166" stroke-width="1.5"/>
  <line x1="264" y1="143" x2="264" y2="151" stroke="#ffd166" stroke-width="2.5"/>

  <!-- Selection Buttons (Push-buttons with LED lights) -->
  <circle cx="264" cy="168" r="6" fill="#ef4444" stroke="#ffffff" stroke-width="1"/>
  <circle cx="264" cy="186" r="6" fill="#0284c7" stroke="#ffffff" stroke-width="1"/>
  <circle cx="264" cy="204" r="6" fill="#eab308" stroke="#ffffff" stroke-width="1"/>
  <circle cx="264" cy="222" r="6" fill="#22c55e" stroke="#ffffff" stroke-width="1"/>
  <!-- Coin Return Lever -->
  <rect x="256" y="238" width="16" height="8" rx="2" fill="#64748b"/>

  <!-- Item Dispense Output Tray (Chute at the bottom) -->
  <rect x="130" y="275" width="140" height="50" rx="4" fill="#05070c" stroke="url(#goldFiligree)" stroke-width="2"/>
  <polygon points="140,285 260,285 250,315 150,315" fill="#090d16"/>
  <!-- Dispensed Healing Potion lying in the tray -->
  <rect x="185" y="295" width="28" height="14" rx="3" fill="#ef4444" stroke="#ffffff" stroke-width="1"/>
  <rect x="213" y="298" width="6" height="8" fill="#b45309"/>
  <!-- Glow from inside the tray -->
  <circle cx="200" cy="300" r="22" fill="#ffd166" opacity="0.3"/>

  <!-- Runes inscribed on lower panel -->
  <text x="200" y="338" fill="#c99738" font-family="'Cinzel Decorative', serif" font-size="10" font-weight="bold" text-anchor="middle" letter-spacing="2">
    ᚠ ᚢ ᚦ ᚨ ᚱ ᚲ
  </text>
</svg>
